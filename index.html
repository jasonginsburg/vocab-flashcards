<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vocab Flashcards</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1d2a24; --muted:#6b7570; --green:#1f5e3b; --amber:#b5651d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; min-height:100dvh;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
  header { display:flex; justify-content:space-between; align-items:center; font-size:15px; color:var(--muted); }
  header b { color:var(--ink); }
  .bar { height:6px; background:#e2ddd2; border-radius:3px; margin:10px 0 16px; overflow:hidden; }
  .bar > div { height:100%; background:var(--green); width:0; transition:width .3s; }
  #card { flex:1; background:var(--card); border-radius:18px; box-shadow:0 4px 18px rgba(0,0,0,.08);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;
    text-align:center; cursor:pointer; user-select:none; min-height:300px; }
  #word { font-family:Georgia,"Times New Roman",serif; font-size:clamp(28px,9vw,44px); font-weight:700;
    letter-spacing:.02em; word-break:break-word; }
  #hint { margin-top:18px; color:var(--muted); font-size:15px; }
  #defs { margin-top:22px; font-size:20px; line-height:1.45; text-align:left; display:none; max-width:30em; }
  #defs ol { margin:0; padding-left:1.4em; } #defs li { margin:6px 0; }
  #defs p { margin:0; text-align:center; }
  .row { display:flex; gap:12px; margin-top:16px; }
  button { flex:1; border:0; border-radius:14px; padding:18px 10px; font-size:18px; font-weight:600; color:#fff; cursor:pointer; }
  button:disabled { opacity:.35; }
  #keep { background:var(--amber); } #dismiss { background:var(--green); }
  #reveal { background:var(--ink); }
  .small { background:none; color:var(--muted); font-size:14px; font-weight:400; padding:6px; flex:none; text-decoration:underline; }
  #done { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  #done h2 { font-size:30px; margin:0 0 8px; }
  #confirm { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; padding:24px; }
  #confirm > div { background:#fff; border-radius:16px; padding:22px; max-width:340px; text-align:center; }
  #confirm .row button { font-size:16px; padding:14px 8px; }
  #break { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:var(--card); border-radius:18px; box-shadow:0 4px 18px rgba(0,0,0,.08); padding:24px; min-height:300px; }
  #breakArt svg { width:min(62vw,240px); height:auto; display:block; margin:0 auto; }
  #break h2 { font-size:28px; margin:14px 0 6px; }
  #break p { margin:0; color:var(--muted); font-size:17px; }
  #goOn { background:var(--green); }
</style>
</head>
<body>
<header>
  <span><b id="left">0</b> left to learn</span>
  <span><b id="known">0</b> / <span id="total">0</span> dismissed</span>
</header>
<div class="bar"><div id="prog"></div></div>

<div id="card">
  <div id="word"></div>
  <div id="hint">Tap to reveal</div>
  <div id="defs"></div>
</div>
<div class="row" id="revealRow"><button id="reveal">Reveal</button></div>
<div class="row" id="answerRow" style="display:none">
  <button id="keep">Keep learning</button>
  <button id="dismiss">I knew it ✓</button>
</div>

<div id="break">
  <div id="breakArt"></div>
  <h2 id="breakTitle"></h2>
  <p id="breakSub"></p>
</div>
<div class="row" id="breakRow" style="display:none"><button id="goOn">Keep going →</button></div>

<div id="done">
  <h2>All done! 🎉</h2>
  <p>You've dismissed every word.</p>
</div>

<div class="row" style="justify-content:center"><button class="small" id="resetBtn">Start over</button></div>

<div id="confirm"><div>
  <p style="margin-top:0;font-size:17px">Start over? All dismissed words come back.</p>
  <div class="row"><button id="no" style="background:#999">Cancel</button><button id="yes" style="background:var(--amber)">Start over</button></div>
</div></div>

const KEY = "vocab-dismissed-v1";
let dismissed = new Set();

function save() { try { localStorage.setItem(KEY, JSON.stringify([...dismissed])); } catch (e) {} }

// ---- Break cards: an original jersey every 25 answered cards, a milestone every 100 ----
// Stored under its own key so the dismissed-words key above is never touched.
const BREAK_KEY = "vocab-breaks-v1";

function nextJersey() {
  if (!brk.bag.length) {

    // don't show the same jersey twice in a row across a reshuffle
    if (brk.bag.length > 1 && brk.bag[brk.bag.length - 1] === brk.last) [brk.bag[0], brk.bag[brk.bag.length - 1]] = [brk.bag[brk.bag.length - 1], brk.bag[0]];

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const $ = id => document.getElementById(id);
let revealed = false;

function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

  $("breakRow").style.display = breakCard ? "flex" : "none";

    $("card").style.display = "none"; $("done").style.display = "none";

      $("breakArt").innerHTML = milestoneSVG(breakCard.n);
      $("breakTitle").textContent = CHEERS[(breakCard.n / 100 - 1) % CHEERS.length];

  $("answerRow").style.display = !empty && revealed ? "flex" : "none";
  if (empty) return;
  const [w, defs] = WORDS[deck[0]];
  $("word").textContent = w;
  $("hint").style.display = revealed ? "none" : "block";
  $("defs").style.display = revealed ? "block" : "none";
  $("defs").innerHTML = defs.length > 1
    ? "<ol>" + defs.map(d => "<li>" + esc(d) + "</li>").join("") + "</ol>"
    : "<p>" + esc(defs[0]) + "</p>";
}

function reveal() { if (!revealed && deck.length) { revealed = true; render(); } }
$("card").onclick = reveal;
$("reveal").onclick = reveal;
$("dismiss").onclick = () => { dismissed.add(WORDS[deck.shift()][0]); save(); revealed = false; answered(); render(); };
$("goOn").onclick = () => { breakCard = null; render(); };
$("keep").onclick = () => {
  const i = deck.shift();
  // put it back somewhere in the rest of the deck so it comes around again
  const pos = deck.length ? Math.min(deck.length, 5 + Math.floor(Math.random() * Math.max(1, deck.length - 5))) : 0;
  deck.splice(pos, 0, i); revealed = false; answered(); render();
};
$("resetBtn").onclick = () => { $("confirm").style.display = "flex"; };
$("no").onclick = () => { $("confirm").style.display = "none"; };
$("yes").onclick = () => { dismissed = new Set(); save(); buildDeck(); revealed = false; $("confirm").style.display = "none"; render(); };

buildDeck(); render();
